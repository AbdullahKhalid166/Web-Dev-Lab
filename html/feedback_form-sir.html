<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Art Workshop Feedback</title>
</head>
<body>
  <h1>Digital Art Workshop Feedback</h1>

  <!-- Feedback Form -->
  <form action="submit_feedback.php" method="POST" enctype="multipart/form-data">

    <!-- Name Input -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" 
           required aria-label="Full Name" tabindex="1"><br><br>

    <!-- Email Input -->
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email address" 
           required aria-label="Email Address" tabindex="2"><br><br>

    <!-- Rating (Dropdown) -->
    <label for="rating">Workshop Rating:</label><br>
    <select id="rating" name="rating" required aria-label="Workshop Rating" tabindex="3">
      <option value="" disabled selected>Select rating</option>
      <option value="excellent">Excellent</option>
      <option value="good">Good</option>
      <option value="average">Average</option>
      <option value="poor">Poor</option>
    </select><br><br>

    <!-- Written Feedback -->
    <label for="feedback">Your Feedback:</label><br>
    <textarea id="feedback" name="feedback" rows="5" cols="40" 
              placeholder="Write your feedback here..." 
              required aria-label="Feedback" tabindex="4"></textarea><br><br>

    <!-- Upload Artwork -->
    <label for="artwork">Upload Your Artwork Sample:</label><br>
    <input type="file" id="artwork" name="artwork" accept="image/*" 
           aria-label="Upload Artwork Image" tabindex="5"><br><br>

    <!-- Preferred Medium (Radio Buttons) -->
    <fieldset>
      <legend>Preferred Art Medium:</legend>
      <input type="radio" id="medium-canvas" name="medium" value="canvas" tabindex="6">
      <label for="medium-canvas">Canvas</label><br>

      <input type="radio" id="medium-video" name="medium" value="video" tabindex="7">
      <label for="medium-video">Video</label><br>

      <input type="radio" id="medium-audio" name="medium" value="audio" tabindex="8">
      <label for="medium-audio">Audio</label>
    </fieldset><br>

    <!-- Recap Video -->
    <h2>Workshop Recap Video</h2>
    <video controls width="400" tabindex="9" aria-label="Workshop Recap Video">
      <source src="recap.mp4" type="video/mp4">
      <p>Your browser does not support the video tag. 
         You can <a href="recap.mp4">download the video</a> instead.</p>
    </video><br><br>

    <!-- Submit Button -->
    <button type="submit" tabindex="10">Submit Feedback</button>
  </form>
<br>
<p id="msg"></p>
<p id="res"></p>

</body>
</html>
