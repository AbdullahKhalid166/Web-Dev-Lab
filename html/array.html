<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Array Example</h1>
    <p id="arrayOutput"></p>
    <script>
        const fruits = ["Apple", "Banana", "Cherry"];
        fruits.push("kiwi")
        document.write(fruits);
        document.getElementById("arrayOutput").innerHTML = "Fruits: " + fruits.join(", ");
    </script>
</body>
</html>
