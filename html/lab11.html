<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 11 - Canvas & SVG</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #f4f4f4;
      height: 100vh;
      margin: 0;
    }

    h2 {
      margin-top: 20px;
      color: #333;
    }

    #drawing-area {
      border: 3px solid #333;
      border-radius: 10px;
      background: white;
      cursor: crosshair;
      margin-bottom: 15px;
    }

    .buttons {
      margin-bottom: 30px;
    }

    button {
      padding: 10px 15px;
      background: #4CAF50;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 10px;
      border-radius: 5px;
      transition: 0.2s;
    }

    button:hover {
      background: #45a049;
    }

    svg {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>🎨 Simple Drawing App (Canvas)</h2>

  <canvas id="drawing-area" width="500" height="300"></canvas>

  <div class="buttons">
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save as Image</button>
  </div>

  <h2>⭐ SVG Animation Example</h2>

  <!-- SIMPLE SVG ANIMATION -->
  <svg width="200" height="100">
    <circle cx="20" cy="50" r="15" fill="red">
      <animate attributeName="cx" from="20" to="180" dur="2s" repeatCount="indefinite" />
    </circle>
  </svg>

  <script>
    const canvas = document.getElementById("drawing-area");
    const ctx = canvas.getContext("2d");

    let drawing = false;

    // Start drawing when mouse is pressed
    canvas.addEventListener("mousedown", () => { drawing = true; });

    // Stop drawing when mouse is released
    canvas.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });

    // Draw on mouse move
    canvas.addEventListener("mousemove", (event) => {
      if (!drawing) return;

      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.strokeStyle = "black";

      ctx.lineTo(event.offsetX, event.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(event.offsetX, event.offsetY);
    });

    // Clear button
    document.getElementById("clearBtn").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Save button
    document.getElementById("saveBtn").addEventListener("click", () => {
      const image = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = image;
      link.download = "my_drawing.png";
      link.click();
    });
  </script>

</body>
</html>
