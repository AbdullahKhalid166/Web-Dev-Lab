<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ANS Fragrance</title>
  <link rel="stylesheet" href="../css/ak.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand">ANS Fragrance</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Contact</h2>
    <p data-animate>Want to try our scents? Reach out and we will send you a sample.</p>
    <form class="contact-form" data-animate>
      <label>Name<input type="text" name="name"></label>
      <label>Email<input type="email" name="email"></label>
      <label>Message<textarea name="message"></textarea></label>
      <button type="submit" class="btn">Send</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© ANS Fragrance</small>
    </div>
  </footer>
  <script src="../js/ak.js"></script>
</body>
</html>
