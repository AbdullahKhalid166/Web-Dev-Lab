<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 9 - To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/lab9.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h1 class="mb-0">My To-Do List</h1>
                    </div>
                    <div class="card-body">
                        <!-- Input section -->
                        <div class="input-group mb-4">
                            <input 
                                type="text" 
                                id="todoInput" 
                                class="form-control" 
                                placeholder="Add a new task..." 
                                aria-label="Enter a new task"
                            >
                            <button class="btn btn-success" id="addBtn" type="button">Add</button>
                        </div>

                        <!-- Filter buttons -->
                        <div class="filter-buttons mb-3">
                            <button class="btn btn-sm btn-outline-primary active" data-filter="all">All</button>
                            <button class="btn btn-sm btn-outline-warning" data-filter="active">Active</button>
                            <button class="btn btn-sm btn-outline-info" data-filter="completed">Completed</button>
                            <button class="btn btn-sm btn-outline-danger" id="clearBtn">Clear Completed</button>
                        </div>

                        <!-- To-do list -->
                        <ul id="todoList" class="list-unstyled">
                            <!-- Todos will be added here dynamically -->
                        </ul>

                        <!-- Empty state -->
                        <div id="emptyState" class="text-center text-muted py-4">
                            <p>No tasks yet. Add one to get started!</p>
                        </div>

                        <!-- Stats -->
                        <hr>
                        <div class="stats-container text-muted small">
                            <span>Total: <strong id="totalCount">0</strong></span>
                            <span class="ms-3">Completed: <strong id="completedCount">0</strong></span>
                            <span class="ms-3">Remaining: <strong id="remainingCount">0</strong></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/lab9.js"></script>
</body>
</html>
